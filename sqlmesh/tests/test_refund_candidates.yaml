a_refund_with_one_earlier_charge_from_the_same_merchant_links_without_asking:
  model: etl.refund_candidates
  inputs:
    etl.purchase_pairs:
      rows:
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-03-01', amount: -30.00, merchant: Shoe Shop, account: Card (...1111), monarch_source_row: 1, amex_source_row: null, monarch_raw: '{"Category":"Shopping"}', amex_raw: null }
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-03-10', amount: 30.00, merchant: SHOE SHOP , account: Card (...1111), monarch_source_row: 2, amex_source_row: null, monarch_raw: '{"Category":"Shopping"}', amex_raw: null }
    etl.transfer_pairs:
      rows: []
  outputs:
    query:
      rows:
        - { refund_id: m2, refund_date: '2026-03-10', refund_amount: 30.00, merchant: SHOE SHOP, refund_account: Card (...1111), candidate_id: m1, candidate_date: '2026-03-01', candidate_amount: -30.00, candidate_rank: 1, candidate_count: 1, link_status: single }

