a_row_posted_a_day_apart_pairs_only_after_same_date_pairs_and_picks_the_nearest_date:
  model: etl.purchase_pairs
  vars:
    amex_account: Card (...1111)
  inputs:
    etl.raw_monarch:
      rows:
        - { source_row_number: 1, source: monarch, transaction_date: '2026-03-01', amount: -9.99, merchant: Streaming, statement: STREAMING, account: Card (...1111), raw_record: '{"Id":"m1"}' }
        - { source_row_number: 2, source: monarch, transaction_date: '2026-03-04', amount: -9.99, merchant: Streaming, statement: STREAMING, account: Card (...1111), raw_record: '{"Id":"m2"}' }
        - { source_row_number: 3, source: monarch, transaction_date: '2026-03-20', amount: -9.99, merchant: Streaming, statement: STREAMING, account: Card (...1111), raw_record: '{"Id":"m3"}' }
    etl.raw_amex:
      rows:
        - { source_row_number: 1, source: amex, transaction_date: '2026-03-01', amount: 9.99, merchant: STREAMING, account: '-11111', raw_record: '{"Reference":"a1"}' }
        - { source_row_number: 2, source: amex, transaction_date: '2026-03-03', amount: 9.99, merchant: STREAMING, account: '-11111', raw_record: '{"Reference":"a2"}' }
  outputs:
    query:
      rows:
        - { match_status: paired, pair_method: exact, transaction_date: '2026-03-01', amount: -9.99, merchant: Streaming, account: Card (...1111), monarch_source_row: 1, amex_source_row: 1, monarch_raw: '{"Id":"m1"}', amex_raw: '{"Reference":"a1"}' }
        - { match_status: paired, pair_method: near_date, transaction_date: '2026-03-04', amount: -9.99, merchant: Streaming, account: Card (...1111), monarch_source_row: 2, amex_source_row: 2, monarch_raw: '{"Id":"m2"}', amex_raw: '{"Reference":"a2"}' }
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-03-20', amount: -9.99, merchant: Streaming, account: Card (...1111), monarch_source_row: 3, amex_source_row: null, monarch_raw: '{"Id":"m3"}', amex_raw: null }

rows_that_differ_in_text_pair_by_order_and_a_row_without_a_date_is_kept_as_invalid:
  model: etl.purchase_pairs
  vars:
    amex_account: Card (...1111)
  inputs:
    etl.raw_monarch:
      rows:
        - { source_row_number: 1, source: monarch, transaction_date: '2026-01-02', amount: -7.00, merchant: Shop, statement: SHOP NUMBER ONE, account: Card (...1111), raw_record: '{"Id":"m1"}' }
        - { source_row_number: 2, source: monarch, transaction_date: null, amount: -1.00, merchant: Bad Date, statement: BAD, account: Card (...1111), raw_record: '{"Id":"m2"}' }
    etl.raw_amex:
      rows:
        - { source_row_number: 1, source: amex, transaction_date: '2026-01-02', amount: 7.00, merchant: SHOP 1, account: '-11111', raw_record: '{"Reference":"a1"}' }
  outputs:
    query:
      rows:
        - { match_status: paired, pair_method: order, transaction_date: '2026-01-02', amount: -7.00, merchant: Shop, account: Card (...1111), monarch_source_row: 1, amex_source_row: 1, monarch_raw: '{"Id":"m1"}', amex_raw: '{"Reference":"a1"}' }
        - { match_status: invalid_key, pair_method: null, transaction_date: null, amount: -1.00, merchant: Bad Date, account: Card (...1111), monarch_source_row: 2, amex_source_row: null, monarch_raw: '{"Id":"m2"}', amex_raw: null }
