pairs_a_charge_with_its_sign_flipped_copy_and_keeps_both_source_rows:
  model: etl.purchase_pairs
  vars:
    amex_account: Card (...1111)
  inputs:
    etl.raw_monarch:
      rows:
        - { source_row_number: 1, source: monarch, transaction_date: '2026-01-02', amount: -12.50, merchant: Cafe Local, statement: CAFE LOCAL 123, account: Card (...1111), raw_record: '{"Id":"m1"}' }
    etl.raw_amex:
      rows:
        - { source_row_number: 1, source: amex, transaction_date: '2026-01-02', amount: 12.50, merchant: CAFE LOCAL 123, account: '-11111', raw_record: '{"Reference":"a1"}' }
  outputs:
    query:
      rows:
        - { match_status: paired, pair_method: exact, transaction_date: '2026-01-02', amount: -12.50, merchant: Cafe Local, account: Card (...1111), monarch_source_row: 1, amex_source_row: 1, monarch_raw: '{"Id":"m1"}', amex_raw: '{"Reference":"a1"}' }

two_real_purchases_of_one_amount_stay_two_records_matched_by_statement_text:
  model: etl.purchase_pairs
  vars:
    amex_account: Card (...1111)
  inputs:
    etl.raw_monarch:
      rows:
        - { source_row_number: 1, source: monarch, transaction_date: '2026-01-02', amount: -4.50, merchant: Coffee B, statement: COFFEE B, account: Card (...1111), raw_record: '{"Id":"m1"}' }
        - { source_row_number: 2, source: monarch, transaction_date: '2026-01-02', amount: -4.50, merchant: Coffee A, statement: COFFEE A, account: Card (...1111), raw_record: '{"Id":"m2"}' }
    etl.raw_amex:
      rows:
        - { source_row_number: 1, source: amex, transaction_date: '2026-01-02', amount: 4.50, merchant: COFFEE A, account: '-11111', raw_record: '{"Reference":"a1"}' }
        - { source_row_number: 2, source: amex, transaction_date: '2026-01-02', amount: 4.50, merchant: COFFEE B, account: '-11111', raw_record: '{"Reference":"a2"}' }
  outputs:
    query:
      rows:
        - { match_status: paired, pair_method: exact, transaction_date: '2026-01-02', amount: -4.50, merchant: Coffee B, account: Card (...1111), monarch_source_row: 1, amex_source_row: 2, monarch_raw: '{"Id":"m1"}', amex_raw: '{"Reference":"a2"}' }
        - { match_status: paired, pair_method: exact, transaction_date: '2026-01-02', amount: -4.50, merchant: Coffee A, account: Card (...1111), monarch_source_row: 2, amex_source_row: 1, monarch_raw: '{"Id":"m2"}', amex_raw: '{"Reference":"a1"}' }

a_coincidence_in_another_account_is_not_paired_and_unmatched_rows_appear_once:
  model: etl.purchase_pairs
  vars:
    amex_account: Card (...1111)
  inputs:
    etl.raw_monarch:
      rows:
        - { source_row_number: 1, source: monarch, transaction_date: '2026-01-05', amount: -20.00, merchant: Gas Station, statement: GAS, account: Checking (...2222), raw_record: '{"Id":"m1"}' }
        - { source_row_number: 2, source: monarch, transaction_date: '2026-01-06', amount: -8.00, merchant: Card Only, statement: CARD ONLY, account: Card (...1111), raw_record: '{"Id":"m2"}' }
    etl.raw_amex:
      rows:
        - { source_row_number: 1, source: amex, transaction_date: '2026-01-05', amount: 20.00, merchant: GAS STATION AMEX, account: '-11111', raw_record: '{"Reference":"a1"}' }
        - { source_row_number: 2, source: amex, transaction_date: '2026-01-07', amount: 3.25, merchant: AMEX ONLY, account: '-11111', raw_record: '{"Reference":"a2"}' }
  outputs:
    query:
      rows:
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-01-05', amount: -20.00, merchant: Gas Station, account: Checking (...2222), monarch_source_row: 1, amex_source_row: null, monarch_raw: '{"Id":"m1"}', amex_raw: null }
        - { match_status: amex_only, pair_method: null, transaction_date: '2026-01-05', amount: -20.00, merchant: GAS STATION AMEX, account: '-11111', monarch_source_row: null, amex_source_row: 1, monarch_raw: null, amex_raw: '{"Reference":"a1"}' }
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-01-06', amount: -8.00, merchant: Card Only, account: Card (...1111), monarch_source_row: 2, amex_source_row: null, monarch_raw: '{"Id":"m2"}', amex_raw: null }
        - { match_status: amex_only, pair_method: null, transaction_date: '2026-01-07', amount: -3.25, merchant: AMEX ONLY, account: '-11111', monarch_source_row: null, amex_source_row: 2, monarch_raw: null, amex_raw: '{"Reference":"a2"}' }

