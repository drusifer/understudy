a_payment_from_checking_pairs_with_the_credit_on_the_card_and_both_are_kept:
  model: etl.transfer_pairs
  inputs:
    etl.business_calendar:
      rows:
        - { day: '2026-03-01', is_business_day: false, business_day_index: 100 }
        - { day: '2026-03-02', is_business_day: true, business_day_index: 101 }
    etl.purchase_pairs:
      rows:
        - { match_status: monarch_only, pair_method: null, transaction_date: '2026-03-01', amount: -500.00, merchant: Amex Payment, account: Checking (...2222), monarch_source_row: 1, amex_source_row: null, monarch_raw: '{"Category":"Credit Card Payment"}', amex_raw: null }
        - { match_status: paired, pair_method: exact, transaction_date: '2026-03-02', amount: 500.00, merchant: Payment Thank You, account: Card (...1111), monarch_source_row: 2, amex_source_row: 1, monarch_raw: '{"Category":"Credit Card Payment"}', amex_raw: '{"Description":"ELECTRONIC PAYMENT RECEIVED-THANK YOU"}' }
  outputs:
    query:
      rows:
        - { record_id: m1, partner_record_id: m2, transfer_status: paired, business_day_gap: 1, transaction_date: '2026-03-01', amount: -500.00, merchant: Amex Payment, account: Checking (...2222) }
        - { record_id: m2, partner_record_id: m1, transfer_status: paired, business_day_gap: 1, transaction_date: '2026-03-02', amount: 500.00, merchant: Payment Thank You, account: Card (...1111) }

