initial: waiting
states:
  waiting:
    tags: [safe]
    on: { OBSERVE: looking }
  looking:
    invoke:
      src: look
      onDone:
        - { target: choosing, guard: { type: phase, params: { is: menu } } }
        - { target: finished, guard: { type: phase, params: { is: done } } }
        - { target: waiting }
  choosing:
    tags: [move]
    on: { STEP: stepping }
  stepping:
    invoke: { src: play, with: { phase: menu, question: next }, onDone: waiting }
  finished:
    type: final
