name: machine_branch
description: A machine with a branch, to test that a guarded transition is taken only when its condition holds.

sinks:
  report: report.jsonl

machine:
  initial: count
  states:
    count:
      do: { map: { action: count } }
      transitions:
        - if:
            drinks: { lt: 500 }
          to: quiet
        - to: busy
    quiet:
      do: { map: { action: mark } }
      then: write
    busy:
      do: { map: { action: mark } }
      then: write
    write:
      do: { sink: { name: report } }
      then: done
    done:
      final: true
