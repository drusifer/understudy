name: machine_branch
description: A scene with a branch, to test that a guarded transition is taken only when its condition holds.

stage:
  report: { kind: file, path: report.jsonl, access: write }

scene:
  initial: count
  beats:
    count:
      do: { map: { action: count } }
      transitions:
        - if:
            drinks: { lt: 500 }
          to: quiet
        - to: busy
    quiet:
      do: { map: { action: mark } }
      to: write
    busy:
      do: { map: { action: mark } }
      to: write
    write:
      do: { write: report }
      to: done
    done:
      final: true
