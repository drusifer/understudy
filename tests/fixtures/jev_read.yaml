name: jev_read
description: A play that reads one Jev beat, to test reading, capture and replay.

stage:
  notes: { kind: file, path: notes.jsonl }
  out: { kind: file, path: out.jsonl, access: write }

scene:
  initial: ask
  beats:
    mood:
      do: { jev: { question: choice } }
      with:
        instructions: How does the customer feel about the notes?
        criteria:
          happy: Smiling, pleased.
          sad: Frowning, disappointed.
        state:
          notes: { from: notes }
    ask:
      do: { map: { action: read } }
      to: write
    write:
      do: { write: out }
      to: done
    done:
      final: true
