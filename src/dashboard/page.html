<!doctype html>
<html lang="en" data-theme="steampunk" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understudy operations console</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="theme-steampunk-light.css">
<link rel="stylesheet" href="theme-professional.css">
<link rel="stylesheet" href="theme-starship.css">
<script src="page.js" defer></script>
</head>
<body>
<div class="room">
<header class="plate">
  <div class="brand">
    <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><g fill="none" stroke="#2b1b0b" stroke-width="2.5"><circle cx="27" cy="27" r="11"/><circle cx="27" cy="27" r="4"/><path d="M27 4v8M27 42v8M4 27h8M42 27h8M10.7 10.7l5.7 5.7M37.6 37.6l5.7 5.7M10.7 43.3l5.7-5.7M37.6 16.4l5.7-5.7"/></g></svg>
    <div>
      <h1>UNDERSTUDY</h1>
      <div class="subtitle">OPERATIONS CONSOLE</div>
    </div>
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <button type="button" id="looks-toggle" class="looks-toggle" aria-expanded="false" aria-controls="looks">LOOK</button>
  <div class="looks" id="looks">
    <div class="theme-switch" role="group" aria-label="Theme">
      <span class="theme-label">THEME</span>
      <button type="button" class="theme-choice" data-theme="steampunk" aria-pressed="true">STEAMPUNK</button>
      <button type="button" class="theme-choice" data-theme="professional" aria-pressed="false">PROFESSIONAL</button>
      <button type="button" class="theme-choice" data-theme="starship" aria-pressed="false">STARSHIP</button>
    </div>
    <div class="theme-switch" role="group" aria-label="Light or dark">
      <span class="theme-label">MODE</span>
      <button type="button" class="mode-choice" data-mode="auto" aria-pressed="true" title="Follow this device's light or dark setting">AUTO</button>
      <button type="button" class="mode-choice" data-mode="light" aria-pressed="false">LIGHT</button>
      <button type="button" class="mode-choice" data-mode="dark" aria-pressed="false">DARK</button>
    </div>
  </div>
  <div class="status">
    <span id="status-lamp" class="lamp standby" aria-hidden="true"></span>
    <span id="status-text">STANDING BY</span>
  </div>
</header>

<nav class="rack" aria-label="Runs">
  <div class="plate-label">RUN RACK</div>
  <div id="rack" class="rack-list" role="tablist"></div>
</nav>

<div id="offline" class="offline" role="status" hidden>DISCONNECTED - retrying. What you see may be out of date.</div>
<div id="banner-slot" role="status"></div>

<main id="console" class="stage watch">
  <section id="printer" class="printer" aria-label="Printer">
    <div class="printer-head"><span>RUN LOG · PRINTER</span><span id="printer-state">IDLE</span></div>
    <div class="finder" role="search" aria-label="Find a line in the log">
      <input id="find-text" type="search" class="find-field" placeholder="find text" aria-label="Show only lines containing this text" autocomplete="off">
      <select id="find-stage" class="find-field" aria-label="Show only one stage"><option value="">all stages</option></select>
      <label class="find-check"><input id="find-failures" type="checkbox"> failures only</label>
      <button type="button" id="jump-start" class="find-button">START</button>
      <button type="button" id="jump-failure" class="find-button" disabled title="no failure in this run">FIRST FAILURE</button>
      <button type="button" id="jump-end" class="find-button">END</button>
    </div>
    <div class="roller" aria-hidden="true"></div>
    <div class="glass">
      <div class="paper-window" id="paper-window" tabindex="0" aria-label="Run log - scroll up to rewind, down to wind on">
        <div id="paper" class="paper" aria-live="polite"></div>
      </div>
    </div>
    <div class="roller take-up" aria-hidden="true"></div>
  </section>

  <section class="tube-panel" aria-label="Stage tube">
    <div class="panel-head"><span>STAGE TUBE</span><span id="tube-caption" class="about">no run chosen</span></div>
    <div id="ended" class="ended about"></div>
    <div id="tube" class="tube stages"></div>
    <div id="gauges" class="gauges" role="group" aria-label="Gauges"></div>
    <dl id="summary" class="summary" aria-label="Run summary"></dl>
  </section>
</main>
</div>
</body>
</html>
