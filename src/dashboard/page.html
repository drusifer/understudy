<!doctype html>
<html lang="en" data-theme="steampunk" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understudy operations console</title>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="theme-steampunk-light.css">
<link rel="stylesheet" href="theme-professional.css">
<link rel="stylesheet" href="theme-starship.css">
<script src="page.js" defer></script>
<script src="controls.js" defer></script>
<script src="replay.js" defer></script>
<script src="decisions.js" defer></script>
</head>
<body>
<div class="room">
<header class="plate">
  <div class="brand">
    <svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><g fill="none" stroke="#2b1b0b" stroke-width="2.5"><circle cx="27" cy="27" r="11"/><circle cx="27" cy="27" r="4"/><path d="M27 4v8M27 42v8M4 27h8M42 27h8M10.7 10.7l5.7 5.7M37.6 37.6l5.7 5.7M10.7 43.3l5.7-5.7M37.6 16.4l5.7-5.7"/></g></svg>
    <div>
      <h1>UNDERSTUDY</h1>
      <div class="subtitle">OPERATIONS CONSOLE</div>
    </div>
    <div class="bulbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <button type="button" id="looks-toggle" class="looks-toggle" aria-expanded="false" aria-controls="looks">LOOK</button>
  <div class="looks" id="looks">
    <div class="theme-switch" role="group" aria-label="Theme">
      <span class="theme-label">THEME</span>
      <button type="button" class="theme-choice" data-theme="steampunk" aria-pressed="true">STEAMPUNK</button>
      <button type="button" class="theme-choice" data-theme="professional" aria-pressed="false">PROFESSIONAL</button>
      <button type="button" class="theme-choice" data-theme="starship" aria-pressed="false">STARSHIP</button>
    </div>
    <div class="theme-switch" role="group" aria-label="Light or dark">
      <span class="theme-label">MODE</span>
      <button type="button" class="mode-choice" data-mode="auto" aria-pressed="true" title="Follow this device's light or dark setting">AUTO</button>
      <button type="button" class="mode-choice" data-mode="light" aria-pressed="false">LIGHT</button>
      <button type="button" class="mode-choice" data-mode="dark" aria-pressed="false">DARK</button>
    </div>
  </div>
  <div class="status">
    <span id="status-lamp" class="lamp standby" aria-hidden="true"></span>
    <span id="status-text">STANDING BY</span>
  </div>
</header>

<nav class="rack" aria-label="Runs">
  <div class="plate-label">RUN RACK</div>
  <div id="rack" class="rack-list" role="tablist"></div>
</nav>

<details id="controls" class="start-panel" hidden>
  <summary>START A RUN</summary>
  <div class="start-grid">
    <label for="sketch-pick" data-launcher>Play</label>
    <select id="sketch-pick" class="find-field" data-launcher></select>
    <div id="sketch-about" class="about" data-launcher></div>
    <div id="fields" class="start-fields" data-launcher></div>
    <label for="replay-pick" data-launcher>Replay from</label>
    <select id="replay-pick" class="find-field" data-launcher><option value="">no - run live</option></select>
    <div class="start-buttons">
      <button type="button" id="show-plan" class="find-button" data-launcher disabled title="Show this play's plan in the diagram; click a beat of the flow to hold a run before it">SHOW PLAN</button>
      <button type="button" id="play" class="find-button" data-launcher disabled>PLAY</button>
      <button type="button" id="play-held" class="find-button" data-launcher disabled>START HELD</button>
      <button type="button" id="stop" class="find-button" data-launcher disabled>STOP THIS RUN</button>
      <button type="button" id="pause" class="find-button" data-hold disabled>PAUSE</button>
      <button type="button" id="step" class="find-button" data-hold disabled>STEP</button>
      <button type="button" id="resume" class="find-button" data-hold disabled>RESUME</button>
    </div>
    <div id="start-message" class="start-message" role="status" aria-live="polite"></div>
  </div>
</details>

<section id="replay" class="start-panel replay-bar" aria-label="Replay" hidden>
  <div class="replay-row">
    <button type="button" id="replay-back" class="find-button" disabled>STEP BACK</button>
    <button type="button" id="replay-play" class="find-button" disabled>PLAY</button>
    <button type="button" id="replay-step" class="find-button" disabled>STEP</button>
    <input type="range" id="replay-scrub" class="slide" min="0" max="0" value="0" step="1" disabled aria-label="Event position in the replay">
    <span id="replay-at" class="readout" role="status" aria-live="polite">event 0 of 0</span>
    <button type="button" id="replay-live" class="find-button">LIVE</button>
  </div>
  <div id="replay-message" class="start-message" role="status" aria-live="polite"></div>
</section>

<div id="offline" class="offline" role="status" hidden>DISCONNECTED - retrying. What you see may be out of date.</div>
<div id="banner-slot" role="status"></div>

<main id="console" class="stage watch">
  <section id="printer" class="printer" aria-label="Printer">
    <div class="printer-head"><span>RUN LOG · PRINTER</span><span id="printer-state">IDLE</span></div>
    <div class="finder" role="search" aria-label="Find a line in the log">
      <input id="find-text" type="search" class="find-field" placeholder="find text" aria-label="Show only lines containing this text" autocomplete="off">
      <select id="find-stage" class="find-field" aria-label="Show only one beat"><option value="">all beats</option></select>
      <label class="find-check"><input id="find-failures" type="checkbox"> failures only</label>
      <button type="button" id="jump-start" class="find-button">START</button>
      <button type="button" id="jump-failure" class="find-button" disabled title="no failure in this run">FIRST FAILURE</button>
      <button type="button" id="jump-end" class="find-button">END</button>
      <button type="button" id="replay-open" class="find-button" disabled title="choose a finished run to replay">REPLAY</button>
    </div>
    <div class="roller" aria-hidden="true"></div>
    <div class="glass">
      <div class="paper-window" id="paper-window" tabindex="0" aria-label="Run log - scroll up to rewind, down to wind on">
        <div id="paper" class="paper" aria-live="polite"></div>
      </div>
    </div>
    <div class="roller take-up" aria-hidden="true"></div>
  </section>

  <section class="tube-panel" aria-label="Beat tube">
    <div class="panel-head"><span>BEAT TUBE</span><span id="tube-caption" class="about">no run chosen</span></div>
    <div id="ended" class="ended about"></div>
    <div id="tube" class="tube stages"></div>
    <div id="gauges" class="gauges" role="group" aria-label="Gauges"></div>
    <dl id="summary" class="summary" aria-label="Run summary"></dl>
    <section id="spending" class="spending" aria-labelledby="spending-title" hidden>
      <h3 id="spending-title" class="spend-title">WHERE THE MONEY WENT</h3>
      <ol id="spending-list" class="spend-list"></ol>
      <p id="spending-more" class="spend-more"></p>
    </section>
    <details id="decisions" class="jev" aria-label="Decisions of this run">
      <summary id="decisions-summary">DECISIONS</summary>
      <div id="decisions-list" class="jev-list"></div>
    </details>
    <details id="jev" class="jev" aria-label="Jev reads of this run">
      <summary id="jev-summary">JEV READS</summary>
      <label class="find-check"><input id="jev-unsure" type="checkbox"> unsure only</label>
      <div id="jev-list" class="jev-list"></div>
    </details>
  </section>

  <section class="tube-panel diagram-panel" aria-label="Diagram">
    <section id="chart" class="chart" aria-labelledby="chart-title">
      <h3 id="chart-title" class="chart-title">PLAY DIAGRAM</h3>
      <p id="chart-note" class="chart-note"></p>
      <div id="chart-wrap" class="chart-wrap" role="group" aria-label="Play diagram" tabindex="0" hidden></div>
    </section>
    <section id="step-view" class="chart" aria-labelledby="step-title" hidden>
      <h3 id="step-title" class="chart-title">STEP</h3>
      <p id="step-note" class="chart-note"></p>
      <dl id="step-body" class="summary" aria-label="What this beat read and made"></dl>
    </section>
  </section>
</main>
</div>
</body>
</html>
