name: household
description: >
  One record per transaction in a household's Monarch and Amex exports: a charge in both files is one record, and
  the two halves of a card payment are linked.

  Values you can set: --with monarch=<csv>  amex=<csv>  amex_account=<part of the card's name in Monarch>
  since=<yyyy-mm-dd>

sources:
  monarch_csv: "{{ monarch }}"
  amex_csv: "{{ amex }}"
  pins_file:                            # the owner's own category for a merchant: {payee, category}; none if the default file is absent
    kind: file
    path: "{{ pinned | default('.understudy/pinned.jsonl') }}"
    optional: pinned
  pins:                                 # what each pinned merchant is called, however it is spelled
    kind: stage
    do: { map: { action: normalize } }
    with: { source: pins_file, field: payee, into: key }
  additions_file:                       # the owner's own categories where ISO has no good match: {group, name}
    kind: file
    path: "{{ additions | default('additions.jsonl') }}"
  iso:                                  # the ISO 18245 merchant categories in use: {group, name}
    kind: stage
    do: { map: { action: mcc } }
  iso_marked:
    kind: stage
    do: { map: { action: set } }
    with: { source: iso, fields: { origin: iso } }
  additions_marked:
    kind: stage
    do: { map: { action: set } }
    with: { source: additions_file, fields: { origin: owner } }
  taxonomy_all:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ iso_marked, additions_marked ] }
  taxonomy:                             # the clean list of categories, each "Group: Name"
    kind: stage
    do: { map: { action: format } }
    with: { source: taxonomy_all, template: "{group}: {name}", into: category }
  monarch_checked:                      # the export's own categories decide what is a transfer, so it must have them
    kind: stage
    do: { map: { action: require } }
    with: { source: monarch_csv, columns: [ Category ] }
  monarch_clean:                        # dates and amounts read from the text
    kind: stage
    do: { map: { action: convert } }
    with: { source: monarch_checked, dates: { Date: date }, amounts: { Amount: amount } }
  amex_clean:                           # a card export lists charges as positive amounts
    kind: stage
    do: { map: { action: convert } }
    with: { source: amex_csv, dates: { Date: date }, amounts: { Amount: amount }, negate: true }
  monarch_numbered:
    kind: stage
    do: { map: { action: number } }
    with: { source: monarch_clean, into: id, prefix: m }
  amex_numbered:
    kind: stage
    do: { map: { action: number } }
    with: { source: amex_clean, into: id, prefix: a }
  monarch_rows:                         # the run's period; a row with no date stays, to be reported
    kind: stage
    do: { map: { action: where } }
    with:
      source: monarch_numbered
      keep: { or: [ { date: { eq: null } }, { date: { ge: "{{ since | default('1900-01-01') }}" } } ] }
  amex_rows:
    kind: stage
    do: { map: { action: where } }
    with:
      source: amex_numbered
      keep: { or: [ { date: { eq: null } }, { date: { ge: "{{ since | default('1900-01-01') }}" } } ] }
  merged:                               # a charge seen in both exports is one record
    kind: stage
    do: { map: { action: pair } }
    with:
      source: monarch_rows
      other: amex_rows
      date: date
      amount: amount
      within: 3
      only: { Account: { has: "{{ amex_account }}" } }
      text: Original Statement
      other_text: Description
  records:                              # one name for what both exports call the same thing
    kind: stage
    do: { map: { action: coalesce } }
    with:
      source: merged
      fields:
        record_id: [ id, other_id ]
        day: [ date, other_date ]
        cost: [ amount, other_amount ]
        payee: [ Merchant, other_Description ]
        card: [ Account, "other_Account #" ]
  candidates:                           # what might be a payment between the owner's own accounts, from the record's own text
    kind: stage
    do: { map: { action: where } }
    with:
      source: records
      keep:
        or:
          - { other_Description: { has: "PAYMENT RECEIVED" } }
          - { payee: { has: Payment } }
          - { payee: { has: PAYMENT } }
          - { payee: { has: Thank You } }
          - { payee: { has: THANK YOU } }
          - { payee: { has: American Express } }
          - { payee: { has: Amex } }
          - { payee: { has: Citi } }
          - { Original Statement: { has: PAYMENT } }
          - { Original Statement: { has: PMT } }
          - { Original Statement: { has: THANK YOU } }
          - { Original Statement: { has: AMERICAN } }
          - { Original Statement: { has: AMEX } }
          - { Original Statement: { has: CITI } }
  legs:                                 # the two halves of a transfer, linked
    kind: stage
    do: { map: { action: link } }
    with: { source: candidates, date: day, amount: cost, apart: card, id: record_id }
  keyed:                                # what each payee is called, however it is spelled
    kind: stage
    do: { map: { action: normalize } }
    with: { source: records, field: payee, into: key }
  linked:
    kind: stage
    do: { map: { action: join } }
    with: { source: keyed, other: legs, on: record_id, keep_unmatched: true }
  unlinked:                             # what Jev is asked about: every payee but the two halves of a payment
    kind: stage
    do: { map: { action: where } }
    with: { source: linked, keep: { and: [ { not: { partner: { ne: null } } }, { match: { ne: invalid_key } } ] } }  # no partner field at all for a record that was never a candidate
  merchants:
    kind: stage
    do: { map: { action: group } }
    with:
      source: unlinked
      by: payee
      collect: { amounts: cost, statements: Original Statement, descriptions: other_Description }
  categorized:                          # each record with its merchant's category, when Jev or a pin placed it
    kind: stage
    do: { map: { action: join } }
    with: { source: linked, other: categories, on: key, keep_unmatched: true, prefix: category_ }
  labeled:                              # why a record is a transfer: a link to the other half, the tool's category, or both
    kind: stage
    do: { map: { action: classify } }
    with:
      source: categorized
      into: transfer_basis
      cases:
        - { if: { and: [ { partner: { ne: null } }, { category_level: { eq: "Household: Transfer" } } ] }, then: both }
        - { if: { partner: { ne: null } }, then: link }
        - { if: { category_level: { eq: "Household: Transfer" } }, then: category }
        - if:                           # a card's own "payment received" line is a payment even when its bank side is not in the data
            or:
              - { other_Description: { has: "PAYMENT RECEIVED" } }
              - { Original Statement: { has: "PAYMENT RECEIVED" } }
              - { Original Statement: { has: "PAYMENT, THANK YOU" } }
              - { Original Statement: { has: "PAYMENT THANK YOU" } }
          then: payment
      otherwise: none
  standing:                             # a transfer by link or by the tool's category; the rest is still open
    kind: stage
    do: { map: { action: classify } }
    with:
      source: labeled
      into: kind
      cases:
        - { if: { match: { eq: invalid_key } }, then: invalid }
        - { if: { transfer_basis: { ne: none } }, then: transfer }
      otherwise: open
  counted:
    kind: stage
    do: { reduce: { action: tally } }
    with: { source: standing, by: transfer_basis, into: transfer_basis }
  plain:                                # what is left is spending
    kind: stage
    do: { map: { action: where } }
    with: { source: counted, keep: { kind: { eq: open } } }
  refunds:                              # money in that the tool did not put in Household: Income
    kind: stage
    do: { map: { action: where } }
    with:
      source: plain
      keep:
        and:
          - { cost: { gt: 0 } }
          - not: { category_level: { eq: "Household: Income" } }  # `ne` would skip a record with no category field at all
  charges:
    kind: stage
    do: { map: { action: where } }
    with: { source: plain, keep: { cost: { lt: 0 } } }
  originals:                            # the charges each refund could have reversed
    kind: stage
    do: { map: { action: earlier } }
    with: { source: refunds, other: charges, on: key, date: day, amount: cost, tie: record_id }
  found:
    kind: stage
    do: { map: { action: classify } }
    with:
      source: originals
      into: link_status
      cases:
        - { if: { candidates: { eq: 0 } }, then: no_original }
        - { if: { candidates: { eq: 1 } }, then: single }
      otherwise: needs_choice
  needing:                              # several charges: Jev chooses
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: needs_choice } } }
  labelled:
    kind: stage
    do: { map: { action: format } }
    with: { source: needing, template: "charged_{candidate_day}_{candidate_cost}_{candidate_record_id}", into: label }
  refund_groups:
    kind: stage
    do: { map: { action: group } }
    with: { source: labelled, by: record_id, collect: { options: label, days: day, costs: cost, payees: payee } }
  refund_readings:                      # Jev, once per refund with several candidates
    kind: stage
    do: { sketch: { file: link_refund } }
    each: refund_groups
  refund_choices:
    kind: stage
    do: { map: { action: unpair } }
    with: { source: refund_readings }
  chosen_original:
    kind: stage
    do: { map: { action: join } }
    with: { source: refund_choices, other: labelled, on: level, other_on: label }
  by_jev:
    kind: stage
    do: { map: { action: classify } }
    with: { source: chosen_original, into: link_status, cases: [], otherwise: chosen }
  singles:
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: single } } }
  without_original:
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: no_original } } }
  refund_links:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ singles, without_original, by_jev ] }
  settled:
    kind: stage
    do: { map: { action: join } }
    with: { source: counted, other: refund_links, on: record_id, keep_unmatched: true }
  typed:                                # what each record is
    kind: stage
    do: { map: { action: classify } }
    with:
      source: settled
      into: kind
      cases:
        - { if: { kind: { eq: invalid } }, then: invalid }
        - { if: { kind: { eq: transfer } }, then: transfer }
        - { if: { link_status: { ne: null } }, then: refund }
        - { if: { cost: { gt: 0 } }, then: credit }
      otherwise: purchase
  spending:                             # what needs a category
    kind: stage
    do: { map: { action: where } }
    with: { source: typed, keep: { kind: { in: [purchase, refund, credit] } } }
  unpinned:                             # a pinned merchant is never asked about
    kind: stage
    do: { map: { action: without } }
    with: { source: merchants, among: pins, on: key }
  pinned_merchants:
    kind: stage
    do: { map: { action: matching } }
    with: { source: merchants, among: pins, on: key }
  pinned_chosen:
    kind: stage
    do: { map: { action: join } }
    with: { source: pinned_merchants, other: pins, on: key, prefix: pin_ }
  pinned_level:
    kind: stage
    do: { map: { action: coalesce } }
    with: { source: pinned_chosen, fields: { level: [ pin_category ] } }
  pinned_placed:                        # placed in the owner's category, and marked as pinned
    kind: stage
    do: { map: { action: set } }
    with: { source: pinned_level, fields: { status: placed, probability: 1.0, source: pin } }
  placements:                           # Jev, once per merchant: a group and a name from the clean list, or neither
    kind: stage
    do: { sketch: { file: categorize_merchant } }
    each: unpinned
    with: { additions: "{{ additions | default('additions.jsonl') }}" }
  placed:
    kind: stage
    do: { map: { action: unpair } }
    with: { source: placements }
  jev_placed:                           # marked as Jev's, as a pin is marked as the owner's
    kind: stage
    do: { map: { action: set } }
    with: { source: placed, fields: { source: jev } }
  decided:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ pinned_placed, jev_placed ] }
  categories:
    kind: stage
    do: { map: { action: where } }
    with: { source: decided, keep: { status: { eq: placed } } }
  finished:                             # whether a record's category was placed, is for review, or was not asked
    kind: stage
    do: { map: { action: classify } }
    with:
      source: typed
      into: category_status
      cases:
        - { if: { kind: { in: [transfer, invalid] } }, then: none }
        - { if: { category_level: { ne: null } }, then: placed }
      otherwise: review

  label_view:                           # what the export's own category says about money moving, kept only to compare
    kind: stage
    do: { map: { action: classify } }
    with:
      source: finished
      into: label_says
      cases:
        - if:
            or:
              - { Category: { eq: Transfer } }
              - { Category: { eq: Credit Card Payment } }
              - { Category: { ends: ": Credit Card Payment" } }
              - { Category: { ends: ": Transfer" } }
              - { Category: { ends: ": Transfers" } }
          then: transfer
      otherwise: spending
  differs_by_record:                    # 1 where the tool and the export disagree about money moving, else 0
    kind: stage
    do: { map: { action: classify } }
    with:
      source: label_view
      into: differs
      cases:
        - { if: { and: [ { kind: { eq: transfer } }, { label_says: { eq: spending } } ] }, then: 1 }
        - { if: { and: [ { kind: { ne: transfer } }, { label_says: { eq: transfer } } ] }, then: 1 }
      otherwise: 0
  cross_merchants:
    kind: stage
    do: { map: { action: group } }
    with:
      source: differs_by_record
      by: payee
      sums:
        amount: cost
        differing: differs
        inflow: { field: cost, where: { cost: { gt: 0 } } }
        outflow: { field: cost, where: { cost: { lt: 0 } } }
      commonest: { export_category: Category, tool_category: category_level }
  cross_volume:                         # how much money moved through the merchant, in or out
    kind: stage
    do: { map: { action: weigh } }
    with: { source: cross_merchants, by: { inflow: 1, outflow: -1 }, into: volume }
  cross_flagged:
    kind: stage
    do: { map: { action: classify } }
    with:
      source: cross_volume
      into: differs_on_money_moving
      cases:
        - { if: { differing: { gt: 0 } }, then: true }
      otherwise: false
  cross_counted:
    kind: stage
    do: { reduce: { action: tally } }
    with: { source: cross_flagged, by: differs_on_money_moving, into: crosswalk_flagged }
  cross_ranked:                         # the most money first
    kind: stage
    do: { reduce: { action: max } }
    with: { source: cross_counted, field: volume, take: 1000000 }
  crosswalk:
    kind: stage
    do: { map: { action: keep } }
    with:
      source: cross_ranked
      fields: [ payee, count, amount, tool_category, export_category, differs_on_money_moving ]
  review_records:                       # the records Jev was not sure enough about to place
    kind: stage
    do: { map: { action: where } }
    with: { source: finished, keep: { category_status: { eq: review } } }
  review_totals:                        # one row per merchant: how many records, how much money
    kind: stage
    do: { map: { action: group } }
    with: { source: review_records, by: payee, sums: { amount: cost } }
  review_asks:                          # what Jev said about each merchant it was not sure of
    kind: stage
    do: { map: { action: where } }
    with: { source: decided, keep: { status: { eq: review } } }
  review_joined:
    kind: stage
    do: { map: { action: join } }
    with: { source: review_totals, other: review_asks, on: key, keep_unmatched: true, prefix: guess_ }
  review_reasons:
    kind: stage
    do: { map: { action: classify } }
    with:
      source: review_joined
      into: reason
      cases:
        - { if: { guess_level: { eq: none_of_these } }, then: none_of_these }
      otherwise: below_0.7
  review_named:
    kind: stage
    do: { map: { action: coalesce } }
    with:
      source: review_reasons
      fields:
        top: [ guess_level ]
        top_probability: [ guess_probability ]
        runner_up: [ guess_runner_up ]
        runner_up_probability: [ guess_runner_up_probability ]
  review_fields:
    kind: stage
    do: { map: { action: keep } }
    with:
      source: review_named
      fields: [ payee, count, amount, top, top_probability, runner_up, runner_up_probability, reason ]
  review_list:                          # the merchants with the most records first
    kind: stage
    do: { reduce: { action: max } }
    with: { source: review_fields, field: count, take: 1000000 }
  spend_rows:                           # what was spent: purchases, and refunds that give some back
    kind: stage
    do: { map: { action: where } }
    with: { source: finished, keep: { kind: { in: [ purchase, refund ] } } }
  spend_default:
    kind: stage
    do: { map: { action: set } }
    with: { source: spend_rows, fields: { unlabeled: uncategorized } }
  spend_named:                          # the owner's own category first, then Jev's, then none
    kind: stage
    do: { map: { action: coalesce } }
    with: { source: spend_default, fields: { category: [ Category, category_level, unlabeled ] } }
  spend_by_category:
    kind: stage
    do: { map: { action: group } }
    with: { source: spend_named, by: category, sums: { net: cost } }
  spend_amounts:                          # money out as a positive figure
    kind: stage
    do: { map: { action: weigh } }
    with: { source: spend_by_category, by: { net: -1 }, into: amount }
  spend_shares:
    kind: stage
    do: { map: { action: share } }
    with: { source: spend_amounts, field: amount, into: share }
  spend_ranked:                         # the biggest first
    kind: stage
    do: { reduce: { action: max } }
    with: { source: spend_shares, field: amount, take: 1000000 }
  spend_list:
    kind: stage
    do: { map: { action: keep } }
    with: { source: spend_ranked, fields: [ category, count, amount, share ] }
  spend_scope:
    kind: stage
    do: { map: { action: set } }
    with: { source: spend_rows, fields: { scope: all } }
  spend_overall:
    kind: stage
    do: { map: { action: group } }
    with: { source: spend_scope, by: scope, sums: { net: cost } }
  spend_total_amount:
    kind: stage
    do: { map: { action: weigh } }
    with: { source: spend_overall, by: { net: -1 }, into: amount }
  spend_total_keep:
    kind: stage
    do: { map: { action: keep } }
    with: { source: spend_total_amount, fields: [ count, amount ] }
  spend_total:                          # the one figure for all spending, also in summary.json
    kind: stage
    do: { reduce: { action: note } }
    with: { source: spend_total_keep, into: spending_total }
  account_totals:                       # money in, money out and net for each account; transfers are not either
    kind: stage
    do: { map: { action: group } }
    with:
      source: spending
      by: card
      sums:
        income: { field: cost, where: { cost: { gt: 0 } } }
        expenses: { field: cost, where: { cost: { lt: 0 } } }
        net: cost
  everywhere:
    kind: stage
    do: { map: { action: classify } }
    with: { source: spending, into: scope, cases: [], otherwise: all }
  overall_total:
    kind: stage
    do: { map: { action: group } }
    with:
      source: everywhere
      by: scope
      sums:
        income: { field: cost, where: { cost: { gt: 0 } } }
        expenses: { field: cost, where: { cost: { lt: 0 } } }
        net: cost
  net_figure:                           # the one figure for the whole run, also in summary.json
    kind: stage
    do: { reduce: { action: note } }
    with: { source: overall_total, into: net_spending }
  totals:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ account_totals, net_figure ] }
  kinds:                                # how many records of each kind, and how many were placed or are for review
    kind: stage
    do: { map: { action: group } }
    with: { source: finished, by: kind }
  statuses:
    kind: stage
    do: { map: { action: group } }
    with: { source: finished, by: category_status }

sinks:
  records: records.jsonl
  legs: legs.jsonl
  kinds: kinds.jsonl
  statuses: statuses.jsonl
  totals: totals.jsonl
  review: review.jsonl
  spending: spending.jsonl
  taxonomy: taxonomy.jsonl
  crosswalk: crosswalk.jsonl

machine:
  initial: check_additions
  states:
    check_additions:                    # a bad additions file or pin stops the run before anything is asked of Jev
      do: { map: { action: complete } }
      with: { source: additions_file, fields: [ group, name ] }
      then: check_additions_unique
    check_additions_unique:
      do: { map: { action: unique } }
      with: { source: additions_file, field: name, among: iso }
      then: check_pins
    check_pins:
      do: { map: { action: complete } }
      with: { source: pins_file, fields: [ payee, category ] }
      then: check_pin_categories
    check_pin_categories:
      do: { map: { action: known } }
      with: { source: pins_file, field: category, among: taxonomy, among_field: category }
      then: write_taxonomy
    write_taxonomy:
      do: { sink: { name: taxonomy } }
      with: { source: taxonomy }
      then: write_records
    write_records:
      do: { sink: { name: records } }
      with: { source: finished }
      then: write_legs
    write_legs:
      do: { sink: { name: legs } }
      with: { source: legs }
      then: write_kinds
    write_kinds:
      do: { sink: { name: kinds } }
      with: { source: kinds }
      then: write_statuses
    write_statuses:
      do: { sink: { name: statuses } }
      with: { source: statuses }
      then: write_totals
    write_totals:
      do: { sink: { name: totals } }
      with: { source: totals }
      then: write_review
    write_review:
      do: { sink: { name: review } }
      with: { source: review_list }
      then: write_crosswalk
    write_crosswalk:
      do: { sink: { name: crosswalk } }
      with: { source: crosswalk }
      then: write_spending
    write_spending:
      do: { sink: { name: spending } }
      with: { source: spend_list }
      then: note_spending
    note_spending:                      # reading the total puts it in summary.json
      do: { reduce: { action: any } }
      with: { source: spend_total }
      then: done
    done:
      final: true
