name: household
description: >
  One record per transaction in a household's Monarch and Amex exports: a charge in both files is one record, and
  the two halves of a card payment are linked.

  Values you can set: --with monarch=<csv>  amex=<csv>  amex_account=<part of the card's name in Monarch>
  since=<yyyy-mm-dd>

sources:
  monarch_csv: "{{ monarch }}"
  amex_csv: "{{ amex }}"
  monarch_clean:                        # dates and amounts read from the text
    kind: stage
    do: { map: { action: convert } }
    with: { source: monarch_csv, dates: { Date: date }, amounts: { Amount: amount } }
  amex_clean:                           # a card export lists charges as positive amounts
    kind: stage
    do: { map: { action: convert } }
    with: { source: amex_csv, dates: { Date: date }, amounts: { Amount: amount }, negate: true }
  monarch_numbered:
    kind: stage
    do: { map: { action: number } }
    with: { source: monarch_clean, into: id, prefix: m }
  amex_numbered:
    kind: stage
    do: { map: { action: number } }
    with: { source: amex_clean, into: id, prefix: a }
  monarch_rows:                         # the run's period; a row with no date stays, to be reported
    kind: stage
    do: { map: { action: where } }
    with:
      source: monarch_numbered
      keep: { or: [ { date: { eq: null } }, { date: { ge: "{{ since | default('1900-01-01') }}" } } ] }
  amex_rows:
    kind: stage
    do: { map: { action: where } }
    with:
      source: amex_numbered
      keep: { or: [ { date: { eq: null } }, { date: { ge: "{{ since | default('1900-01-01') }}" } } ] }
  merged:                               # a charge seen in both exports is one record
    kind: stage
    do: { map: { action: pair } }
    with:
      source: monarch_rows
      other: amex_rows
      date: date
      amount: amount
      within: 3
      only: { Account: { has: "{{ amex_account }}" } }
      text: Original Statement
      other_text: Description
  records:                              # one name for what both exports call the same thing
    kind: stage
    do: { map: { action: coalesce } }
    with:
      source: merged
      fields:
        record_id: [ id, other_id ]
        day: [ date, other_date ]
        cost: [ amount, other_amount ]
        payee: [ Merchant, other_Description ]
        card: [ Account, "other_Account #" ]
  candidates:                           # what might be money moving between the owner's own accounts
    kind: stage
    do: { map: { action: where } }
    with:
      source: records
      keep:
        or:
          - { Category: { has: Transfer } }
          - { Category: { has: transfer } }
          - { Category: { has: Payment } }
          - { Category: { has: payment } }
          - { other_Description: { has: "PAYMENT RECEIVED" } }
          - { other_Description: { has: "Payment Received" } }
  legs:                                 # the two halves of a transfer, linked
    kind: stage
    do: { map: { action: link } }
    with: { source: candidates, date: day, amount: cost, apart: card, id: record_id }
  unpaired:                             # candidates with no partner: is the payee one of the owner's accounts?
    kind: stage
    do: { map: { action: where } }
    with: { source: legs, keep: { partner: { eq: null } } }
  payees:
    kind: stage
    do: { map: { action: group } }
    with: { source: unpaired, by: payee, collect: { amounts: cost } }
  readings:                             # Jev, once per payee
    kind: stage
    do: { sketch: { file: judge_payee } }
    each: payees
    with: { monarch: "{{ monarch }}" }
  judged:
    kind: stage
    do: { map: { action: unpair } }
    with: { source: readings }
  keyed:                                # what each payee is called, however it is spelled
    kind: stage
    do: { map: { action: normalize } }
    with: { source: records, field: payee, into: key }
  linked:
    kind: stage
    do: { map: { action: join } }
    with: { source: keyed, other: legs, on: record_id, keep_unmatched: true }
  read:
    kind: stage
    do: { map: { action: join } }
    with: { source: linked, other: judged, on: key, keep_unmatched: true, prefix: judged_ }
  standing:                             # transfers and invalid rows are settled; the rest is still open
    kind: stage
    do: { map: { action: classify } }
    with:
      source: read
      into: kind
      cases:
        - { if: { match: { eq: invalid_key } }, then: invalid }
        - { if: { partner: { ne: null } }, then: transfer }
        - { if: { and: [ { partner: { eq: null } }, { judged_decision: { eq: external_transfer } } ] }, then: external_transfer }
      otherwise: open
  plain:                                # what is left is spending
    kind: stage
    do: { map: { action: where } }
    with: { source: standing, keep: { kind: { eq: open } } }
  refunds:                              # money in that is not income
    kind: stage
    do: { map: { action: where } }
    with:
      source: plain
      keep:
        and:
          - { cost: { gt: 0 } }
          - not:
              or:
                - { Category: { has: Income } }
                - { Category: { has: income } }
                - { Category: { has: Paycheck } }
                - { Category: { has: paycheck } }
                - { Category: { has: Interest } }
                - { Category: { has: interest } }
                - { Category: { has: Payroll } }
                - { Category: { has: payroll } }
  charges:
    kind: stage
    do: { map: { action: where } }
    with: { source: plain, keep: { cost: { lt: 0 } } }
  originals:                            # the charges each refund could have reversed
    kind: stage
    do: { map: { action: earlier } }
    with: { source: refunds, other: charges, on: key, date: day, amount: cost, tie: record_id }
  found:
    kind: stage
    do: { map: { action: classify } }
    with:
      source: originals
      into: link_status
      cases:
        - { if: { candidates: { eq: 0 } }, then: no_original }
        - { if: { candidates: { eq: 1 } }, then: single }
      otherwise: needs_choice
  needing:                              # several charges: Jev chooses
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: needs_choice } } }
  labelled:
    kind: stage
    do: { map: { action: format } }
    with: { source: needing, template: "charged_{candidate_day}_{candidate_cost}_{candidate_record_id}", into: label }
  refund_groups:
    kind: stage
    do: { map: { action: group } }
    with: { source: labelled, by: record_id, collect: { options: label, days: day, costs: cost, payees: payee } }
  refund_readings:                      # Jev, once per refund with several candidates
    kind: stage
    do: { sketch: { file: link_refund } }
    each: refund_groups
  refund_choices:
    kind: stage
    do: { map: { action: unpair } }
    with: { source: refund_readings }
  chosen_original:
    kind: stage
    do: { map: { action: join } }
    with: { source: refund_choices, other: labelled, on: level, other_on: label }
  by_jev:
    kind: stage
    do: { map: { action: classify } }
    with: { source: chosen_original, into: link_status, cases: [], otherwise: chosen }
  singles:
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: single } } }
  without_original:
    kind: stage
    do: { map: { action: where } }
    with: { source: found, keep: { link_status: { eq: no_original } } }
  refund_links:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ singles, without_original, by_jev ] }
  settled:
    kind: stage
    do: { map: { action: join } }
    with: { source: standing, other: refund_links, on: record_id, keep_unmatched: true }
  typed:                                # what each record is
    kind: stage
    do: { map: { action: classify } }
    with:
      source: settled
      into: kind
      cases:
        - { if: { kind: { eq: invalid } }, then: invalid }
        - { if: { kind: { eq: transfer } }, then: transfer }
        - { if: { kind: { eq: external_transfer } }, then: external_transfer }
        - { if: { link_status: { ne: null } }, then: refund }
        - { if: { cost: { gt: 0 } }, then: credit }
      otherwise: purchase
  spending:                             # what needs a category
    kind: stage
    do: { map: { action: where } }
    with: { source: typed, keep: { kind: { in: [purchase, refund, credit] } } }
  merchants:
    kind: stage
    do: { map: { action: group } }
    with:
      source: spending
      by: payee
      collect: { amounts: cost, statements: Original Statement, descriptions: other_Description }
  monarch_labels:                       # Monarch's own labels for spending, not the ones about moving money
    kind: stage
    do: { map: { action: where } }
    with:
      source: typed
      keep:
        and:
          - { Category: { has: ": " } }
          - not:
              or:
                - { Category: { has: Transfer } }
                - { Category: { has: transfer } }
                - { Category: { has: Payment } }
                - { Category: { has: payment } }
  offered:
    kind: stage
    do: { map: { action: group } }
    with: { source: monarch_labels, by: Category }
  merchants_and_categories:
    kind: stage
    do: { map: { action: attach } }
    with: { source: merchants, other: offered, field: Category, into: categories }
  placements:                           # Jev, once per merchant: which category in use, if any
    kind: stage
    do: { sketch: { file: place_merchant } }
    each: merchants_and_categories
  placed:
    kind: stage
    do: { map: { action: unpair } }
    with: { source: placements }
  unfit:                                # no category in use fits
    kind: stage
    do: { map: { action: where } }
    with: { source: placed, keep: { status: { eq: unfit } } }
  fitted:
    kind: stage
    do: { map: { action: where } }
    with: { source: placed, keep: { status: { ne: unfit } } }
  named:                                # Jev names the rest in turn, each seeing the names given before it
    kind: stage
    do: { sketch: { file: name_merchant } }
    each: unfit
    reduce: { action: concat, into: earlier }
  decided:
    kind: stage
    do: { map: { action: concat } }
    with: { sources: [ fitted, named ] }
  categories:
    kind: stage
    do: { map: { action: where } }
    with: { source: decided, keep: { status: { eq: placed } } }
  categorized:
    kind: stage
    do: { map: { action: join } }
    with: { source: typed, other: categories, on: key, keep_unmatched: true, prefix: category_ }
  finished:                             # whether a record's category was placed, is for review, or was not asked
    kind: stage
    do: { map: { action: classify } }
    with:
      source: categorized
      into: category_status
      cases:
        - { if: { kind: { in: [transfer, external_transfer, invalid] } }, then: none }
        - { if: { category_level: { ne: null } }, then: placed }
      otherwise: review

  kinds:                                # how many records of each kind, and how many were placed or are for review
    kind: stage
    do: { map: { action: group } }
    with: { source: finished, by: kind }
  statuses:
    kind: stage
    do: { map: { action: group } }
    with: { source: finished, by: category_status }

sinks:
  records: records.jsonl
  legs: legs.jsonl
  judgments: judgments.jsonl
  kinds: kinds.jsonl
  statuses: statuses.jsonl

machine:
  initial: write_records
  states:
    write_records:
      do: { sink: { name: records } }
      with: { source: finished }
      then: write_legs
    write_legs:
      do: { sink: { name: legs } }
      with: { source: legs }
      then: write_judgments
    write_judgments:
      do: { sink: { name: judgments } }
      with: { source: judged }
      then: write_kinds
    write_kinds:
      do: { sink: { name: kinds } }
      with: { source: kinds }
      then: write_statuses
    write_statuses:
      do: { sink: { name: statuses } }
      with: { source: statuses }
      then: done
    done:
      final: true
