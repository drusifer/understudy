# yaml-language-server: $schema=../../schema/sketch.schema.json
# The web example's sketch (docs/SKETCHES.md): the page is played as it
# is. With no hooks, the generic page app offers whatever a person could
# press on it; `turn` says where it ends.
name: signup-web
description: >-
  An understudy signs up for an account: it answers each step's question as
  a careful new user would, until the account is ready.
target: { kind: page, page: index.html }

questions:
  answer:
    type: choice
    instructions: >-
      You are a careful new user signing up for an app you want to try before paying for
      anything. The `page` says `says`, and `controls` are what you could press or pick on it
      now. Choose what you would do next to finish signing up.
    criteria:
      button: press this button
      link: follow this link
      checkbox: tick this box
      radio: pick this choice
      option: pick this from the list

turn:
  initial: waiting
  states:
    waiting:
      description: "Nothing to answer yet; looks again. Safe to stop."
      tags: [safe]
      on: { OBSERVE: looking }
    looking:
      description: "Reads what the app shows to find the phase."
      invoke:
        src: look
        onDone:
          - { target: finished, guard: { type: showing, params: { text: Welcome aboard } } }
          - { target: answering, guard: { type: phase, params: { is: asking } } }
          - { target: waiting }
    answering:
      description: "A question is waiting for an answer."
      tags: [move]
      on: { STEP: replying }
    replying:
      description: "Jev picks one of the offered answers and it is given to the app."
      invoke: { src: play, with: { phase: asking, question: answer }, onDone: waiting }
    finished:
      description: "The account is ready; the run ends."
      type: final
