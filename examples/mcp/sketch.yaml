# The MCP example's sketch (docs/SKETCHES.md): the box office in server.mjs,
# played through its tools with no code - the generic MCP app offers each
# tool, and Jev chooses the arguments from what the tools allow and what
# the last call answered. `turn` says where it ends.
name: boxoffice-mcp
description: >-
  An understudy buys cinema tickets from a box office server: it looks at
  what is on, holds seats for a film it would enjoy and pays, until a ticket
  is issued.
target:
  kind: mcp
  server: { command: node, args: [server.mjs] }

questions:
  next:
    type: choice
    instructions: >-
      You are someone buying cinema tickets for yourself and a friend tonight. `tools` are
      what the box office lets you do and `last_call` is what it last told you. Choose what
      to do next to end up with tickets for a film you would both enjoy, paying what it costs.

turn:
  initial: waiting
  states:
    waiting:
      description: "Looks at the box office again. Safe to stop."
      tags: [safe]
      on: { OBSERVE: looking }
    looking:
      description: "Reads what the box office offers and what it last said."
      invoke:
        src: look
        onDone:
          - { target: finished, guard: { type: showing, params: { text: Ticket issued } } }
          - { target: choosing, guard: { type: phase, params: { is: asking } } }
          - { target: waiting }
    choosing:
      description: "Something can be done at the box office."
      tags: [move]
      on: { STEP: acting }
    acting:
      description: "Jev picks a tool and its arguments, and the call is made."
      invoke: { src: play, with: { phase: asking, question: next }, onDone: waiting }
    finished:
      description: "A ticket was issued; the run ends."
      type: final
