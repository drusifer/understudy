# The CLI example's sketch (docs/SKETCHES.md): wait for the counter to ask
# something, answer it, and stop when the order is placed. Every name in
# `turn` is from the library (`understudy library examples/cli`).
name: coffee-cli
description: >-
  An understudy orders a coffee at the counter: it answers each question the
  counter asks, as a person who wants a coffee they would enjoy, until the
  order is placed.
target: { kind: process, command: node, args: [app.mjs] }
app: hooks.mjs

questions:
  answer:
    type: choice
    instructions: >-
      You are a person ordering a coffee at a counter. The counter is asking about
      `topic`; `answered_so_far` is what you already chose and `counter_says` is what it
      last told you. Pick the answer you would give if you wanted a coffee you would
      enjoy, and place the order once it looks right.
    criteria:
      size: answer this size
      milk: answer this milk choice
      confirm: answer this to the confirmation question

turn:
  initial: waiting
  states:
    waiting:
      description: "Nothing to answer yet; looks again. Safe to stop."
      tags: [safe]
      on: { OBSERVE: looking }
    looking:
      description: "Reads the counter's output to find the phase."
      invoke:
        src: look
        onDone:
          - { target: answering, guard: { type: phase, params: { is: asking } } }
          - { target: finished, guard: { type: phase, params: { is: done } } }
          - { target: waiting }
    answering:
      description: "A question is waiting for an answer."
      tags: [move]
      on: { STEP: replying }
    replying:
      description: "Jev picks an answer from the menu and it is given to the counter."
      invoke: { src: play, with: { phase: asking, question: answer }, onDone: waiting }
    finished:
      description: "The order is placed; the run ends."
      type: final
