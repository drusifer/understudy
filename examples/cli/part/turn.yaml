# The CLI example's part: wait for the counter to ask something, answer
# it, and stop when the order is placed. Every name is from the library
# (`understudy library`).
description: >-
  An understudy orders a coffee at the counter: it answers each question the
  counter asks, as a person who wants a coffee they would enjoy, until the
  order is placed.

initial: waiting
states:
  waiting:
    description: "Nothing to answer yet; looks again. Safe to stop."
    tags: [safe]
    on: { OBSERVE: looking }
  looking:
    description: "Reads the counter's output to find the phase."
    invoke:
      src: look
      onDone:
        - { target: answering, guard: { type: phase, params: { is: asking } } }
        - { target: finished, guard: { type: phase, params: { is: done } } }
        - { target: waiting }
  answering:
    description: "A question is waiting for an answer."
    tags: [move]
    on: { STEP: replying }
  replying:
    description: "Jev picks an answer from the menu and it is given to the counter."
    invoke: { src: play, with: { phase: asking, question: answer }, onDone: waiting }
  finished:
    description: "The order is placed; the run ends."
    type: final
