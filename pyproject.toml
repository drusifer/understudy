[project]
name = "understudy-etl"
version = "0.1.0"
requires-python = "==3.12.15.*"
dependencies = [
    "duckdb==1.5.6",
    "holidays==0.107",
    "iso18245==1.4.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "mcp==2.3.0",
    "python-statemachine[yaml]==3.2.2",
    "ruamel.yaml==0.19.1",
    "sqlmesh[duckdb]==0.236.3",
    "typesafe-sdk==0.7.5",
]

[dependency-groups]
dev = ["ruff==0.9.10"]

[tool.ruff]
line-length = 135
target-version = "py312"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, simplify, pyupgrade, naming, comprehensions,
# performance, ruff's own, dead code (ERA, ARG), complexity (C90) and the Pylint checks
select = ["E", "W", "F", "I", "B", "SIM", "UP", "N", "C4", "PERF", "RUF", "ERA", "ARG", "C90", "PL", "T20", "RET", "PTH"]

[tool.ruff.lint.per-file-ignores]
# test doubles must match the signatures they stand in for; tests print and take many fixtures
"tests/python/*" = ["ARG", "PLR0913", "T201", "SIM117"]
# the MCP source server and the CLI speak on stdout
"src/etl/source_server.py" = ["T201"]
"src/etl/cli.py" = ["T201"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.uv]
package = false
